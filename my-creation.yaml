apiVersion: apps/v1
kind: Deployment
metadata:
  name: mask
  labels: 
    app: mask
spec: 
  replicas: 1 
  selector:
    matchLabels:
      app: mask
  template: 
    metadata:
      labels: 
       app: mask
    spec: 
      containers:
       - name: nginx
         image: nginx:latest
         ports:
          - containerPort: 80
         resources: 
           requests:
            cpu: "100m"
            memory: "150Mi"
           limits: 
            cpu: "500m"
            memory: "500Mi"
       
       - name: busybox
         image: busybox 
         command: ["sh" , "-c"]
         args: ["echo Jesus is the Lord && sleep 3600"]





