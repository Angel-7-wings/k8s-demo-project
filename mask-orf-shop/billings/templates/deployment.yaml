apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.name }}"

  labels:
    app: "{{ .Values.app }}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "{{ .Values.app }}"
  strategy: 
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 1
       maxUnavailable: 1 
  template:
    metadata:
      labels:
        app: "{{ .Values.app }}"
    spec:
      containers:
      - image: "{{ .Values.containers.image }}"
        name: "{{ .Values.containers.name }}"
        resources:
          requests:
            cpu: "{{ .Values.resources.requests.cpu }}"
            memory: "{{ .Values.resources.requests.memory }}"
          limits:
            cpu: "{{ .Values.resources.limits.cpu }}"
            memory: "{{ .Values.resources.limits.memory }}"
